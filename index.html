<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My Wishlist &#x2B50;</title>
<style>
:root{--bg:#EEF2F9;--card:#fff;--ink:#16203A;--mute:#5E6A85;--line:#D5DCEB;--acc:#3556D8;--accT:#fff;--red:#E5484D;--yel:#F5B301;--grn:#2FA866;--ok:#1E7F4F}
@media(prefers-color-scheme:dark){:root{--bg:#0F1526;--card:#182038;--ink:#EAEFFB;--mute:#9AA6C4;--line:#2A3556;--acc:#7C97FF;--accT:#0F1526;--ok:#5FD29B}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:16px 16px 48px}
main{max-width:560px;margin:0 auto}
h1,.big{font-family:'Avenir Next','Trebuchet MS',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 4px 18px}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.sum{text-align:right;color:var(--mute);font-size:13px}
.big{display:block;color:var(--ink);font-size:22px;font-weight:800}

/* Kartu form berbentuk label harga: lubang gantungan di atas */
form{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:20px 20px 14px 14px;padding:44px 18px 20px}
form::before{content:"";position:absolute;top:14px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
label,.lbl{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
.opt{font-weight:400;color:var(--mute)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#barang,#spesifikasi,#keterangan{text-transform:uppercase}
.rp{position:relative}.rp span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}.rp input{padding-left:40px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;font-weight:500;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg input:focus-visible+label{outline:3px solid var(--acc);outline-offset:2px}

.pic{display:flex;gap:14px;align-items:center}
.thumb{flex:none;width:96px;height:96px;border-radius:12px;border:2px dashed var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center}
.thumb.has{border-style:solid;border-color:var(--ink)}
.pic p{margin:6px 0 0;font-size:13px;color:var(--mute)}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600}
.save{width:100%;margin-top:22px;background:var(--acc);color:var(--accT);border:0;border-radius:12px;padding:15px;font-weight:700;font-size:17px}
.save:disabled{opacity:.6;cursor:wait}
#msg{min-height:22px;margin:12px 2px 0;font-size:14px}
#msg.ok{color:var(--ok)}#msg.err{color:var(--red)}

h2{font-size:18px;margin:32px 4px 10px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.item img,.item .ph{flex:none;width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bg)}
.item b{display:block;font-size:14px;line-height:1.3;word-break:break-word}
.item small{color:var(--mute)}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:10px;background:none;border:0;color:inherit;text-align:left}
.row>div{flex:1;min-width:0}
.chev{flex:none;width:8px;height:8px;margin:0 6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s}
.row[aria-expanded=true] .chev{transform:rotate(-135deg)}
.det{padding:2px 14px 14px;border-top:1px solid var(--line)}
.det.muted{color:var(--mute);font-size:14px;padding-top:12px}
.kv{margin-top:12px;font-size:14px}
.kv span{display:block;font-weight:600;font-size:13px;color:var(--mute);margin-bottom:2px}
.kv div,.kv a{white-space:pre-wrap;overflow-wrap:anywhere}
.kv a{color:var(--acc)}
.gate{max-width:420px;margin:12vh auto 0;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:24px 20px}
.gate h2{margin:0 0 4px;font-size:22px}
.gate p{margin:0 0 6px;color:var(--mute);font-size:14px}
.gate[hidden],main[hidden]{display:none}
.kv.muted{color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:16px}
.sm{padding:7px 14px;font-size:14px}
.danger{color:var(--red);border-color:var(--red)}
.edit .save{margin-top:16px}
.edit .acts{margin-top:12px}
.item.done .row{opacity:.6}
.item.batal b{text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.empty{color:var(--mute);padding:8px 4px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.stats button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px}
.stats button b{font-family:'Avenir Next','Trebuchet MS',system-ui,sans-serif;font-size:18px;margin-right:6px}
.stats button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.boot{padding:10px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);margin-bottom:14px;font-size:14px}
.boot.err{border-color:var(--red);color:var(--red)}
.sub{margin:-4px 4px 10px;color:var(--mute);font-size:13px}
@media(prefers-reduced-motion:no-preference){.item.new{animation:pop .5s}@keyframes pop{from{background:var(--acc);transform:scale(.97)}}}
</style>
</head>
<body>
<main id="app">
  <noscript><p class="boot err">JavaScript dimatikan di browser ini.</p></noscript>
  <div id="boot" class="boot">Memuat wishlist&#x2026;</div>
  <header>
    <h1>My Wishlist &#x2B50;</h1>
    <div class="sum"><span class="big" id="total">Rp0</span><span id="count">0 barang</span></div>
  </header>

  <div class="stats" id="stats"></div>

  <form id="f" autocomplete="off">
    <label for="barang" style="margin-top:0">Nama barang</label>
    <input type="text" id="barang" autocapitalize="characters" required placeholder="Contoh: New Balance 530">

    <label for="kategori">Kategori</label>
    <select id="kategori"></select>

    <label for="harga">Estimasi harga</label>
    <div class="rp"><span>Rp</span><input type="text" id="harga" inputmode="numeric" autocomplete="off" placeholder="1.700.000"></div>

    <div class="lbl">Prioritas</div>
    <div class="seg" id="prioritas"></div>

    <div class="lbl">Status</div>
    <div class="seg" id="status"></div>

    <div class="lbl">Gambar</div>
    <div class="pic">
      <div class="thumb" id="thumb">Belum ada</div>
      <div>
        <button type="button" class="ghost" id="pick">Pilih foto</button>
        <input type="file" id="file" accept="image/*" hidden>
        <p>Kosongkan saja kalau mau diambil otomatis dari link produk.</p>
      </div>
    </div>
    <label for="imageUrl">Atau tempel link gambar <span class="opt">(opsional)</span></label>
    <input type="url" id="imageUrl" placeholder="https://...jpg">

    <label for="link">Link produk</label>
    <input type="url" id="link" placeholder="https://shopee.co.id/...">

    <label for="spesifikasi">Spesifikasi <span class="opt">(opsional)</span></label>
    <textarea id="spesifikasi" autocapitalize="characters"></textarea>

    <label for="keterangan">Keterangan <span class="opt">(opsional)</span></label>
    <textarea id="keterangan" autocapitalize="characters" style="min-height:56px"></textarea>

    <button class="save" id="save" type="submit">Simpan ke spreadsheet</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>

  <h2>Semua wishlist</h2>
  <p class="sub" id="sub"></p>
  <div id="list"><p class="empty">Memuat&#x2026;</p></div>
</main>

<div id="toast" class="toast" role="status" hidden></div>
<div id="gate" class="gate" hidden>
  <h2>Masuk dulu</h2>
  <p>Wishlist ini pribadi. Masukkan password yang kamu pasang di Code.gs.</p>
  <div id="gurlbox"><label for="gurl">Link web app (berakhiran /exec)</label><input type="url" id="gurl" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <label for="gpass">Password</label>
  <input type="password" id="gpass" autocomplete="current-password">
  <button type="button" class="save" id="gbtn">Masuk</button>
  <div id="gerr" class="boot err" style="display:none;margin-top:12px"></div>
</div>
<script>
// ---- Penghubung ke Apps Script (meniru google.script.run lewat fetch) ----
// Isi dengan link web app berakhiran /exec supaya tidak perlu mengetiknya di tiap HP.
const API_URL = 'https://script.google.com/macros/s/AKfycbxdgFeJrXyBAQdqov3bQ8JZXwZ7A-xNxLsEf8QVlwUs3mlFiqpxTQEBK_Yll4LhDulY/exec';
const mem = {};
function LS(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k) || mem[k] || '';
    if (v === null) { localStorage.removeItem(k); delete mem[k]; } else { localStorage.setItem(k, v); mem[k] = v; }
  } catch (e) { if (v === undefined) return mem[k] || ''; if (v === null) delete mem[k]; else mem[k] = v; }
  return '';
}
const el = id => document.getElementById(id);
let pending = null;
function needGate(job, msg) {
  pending = job;
  el('gurlbox').style.display = API_URL ? 'none' : 'block';
  el('gerr').style.display = msg ? 'block' : 'none'; el('gerr').textContent = msg || '';
  el('gate').hidden = false; el('app').hidden = true;
}
el('gbtn').onclick = () => {
  const url = API_URL || el('gurl').value.trim(), pass = el('gpass').value;
  if (!url || !pass) { needGate(pending, 'Isi link dan password.'); return; }
  LS('wl_url', url); LS('wl_tok', pass);
  el('gate').hidden = true; el('app').hidden = false;
  const job = pending; pending = null; if (job) job();
};
function send(name, args, ok, fail) {
  const url = API_URL || LS('wl_url'), tok = LS('wl_tok');
  if (!url || !tok) { needGate(() => send(name, args, ok, fail)); return; }
  fetch(url, { method: 'POST', body: JSON.stringify({ fn: name, args: args, token: tok }) })
    .then(r => r.json())
    .then(j => {
      if (j.error) {
        if (/password/i.test(j.error)) { LS('wl_tok', null); needGate(() => send(name, args, ok, fail), 'Password salah.'); return; }
        throw new Error(j.error);
      }
      if (ok) ok(j.result);
    })
    .catch(e => { if (fail) fail(e); });
}
function makeRun(ok, fail) {
  const run = { withSuccessHandler: f => makeRun(f, fail), withFailureHandler: f => makeRun(ok, f) };
  ['getInitData', 'addWish', 'updateWish', 'deleteWish', 'getImageData'].forEach(n => {
    run[n] = function () { send(n, Array.prototype.slice.call(arguments), ok, fail); };
  });
  return run;
}
window.google = { script: { run: makeRun() } };
</script>
<script>
const $ = id => document.getElementById(id);
function boot(t, err) { const b = $('boot'); b.hidden = !t; b.textContent = t || ''; b.className = 'boot' + (err ? ' err' : ''); }
window.onerror = m => boot('Error di halaman: ' + m, true);
setTimeout(() => { if (!OPTS) boot('Data belum masuk. Cek Code.gs sudah lengkap dan deployment memakai New version.', true); }, 10000);
let imageBase64 = '';

const rupiah = n => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const say = (t, cls) => { $('msg').textContent = t; $('msg').className = cls || ''; };

function radios(id, items, def) {
  $(id).innerHTML = '';
  items.forEach((t, i) => {
    const rid = id + i;
    const inp = Object.assign(document.createElement('input'), { type: 'radio', name: id, id: rid, value: t, checked: i === def });
    const lab = Object.assign(document.createElement('label'), { htmlFor: rid, textContent: t });
    $(id).append(inp, lab);
  });
}

// Titik ribuan otomatis saat mengetik harga
function rupiahInput() {
  const before = this.value.slice(0, this.selectionStart).replace(/\D/g, '').length;
  const digits = this.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  const f = digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  this.value = f;
  let c = 0, i = 0;
  while (i < f.length && c < before) { if (/\d/.test(f[i])) c++; i++; }
  this.setSelectionRange(i, i);
}
$('harga').oninput = rupiahInput;

// Gambar daftar: coba langsung, kalau gagal minta server yang mengambilkan
const IMGS = {}, queue = []; let busy = 0;
function show(el, d) { if (d && el.isConnected) el.src = d; }
function pump() {
  while (busy < 3 && queue.length) {
    const job = queue.shift();
    if (IMGS[job.w.row] !== undefined) { show(job.el, IMGS[job.w.row]); continue; }
    busy++;
    google.script.run
      .withSuccessHandler(d => { IMGS[job.w.row] = d; busy--; show(job.el, d); pump(); })
      .withFailureHandler(() => { IMGS[job.w.row] = ''; busy--; pump(); })
      .getImageData(job.w.row);
  }
}
function makeThumb(w) {
  const img = document.createElement('img');
  img.alt = ''; img.referrerPolicy = 'no-referrer';
  if (IMGS[w.row]) { img.src = IMGS[w.row]; return img; }
  let tried = false;
  const viaServer = () => { tried = true; queue.push({ w: w, el: img }); pump(); };
  img.onerror = () => { if (!tried) { img.removeAttribute('src'); viaServer(); } };
  if (w.img) img.src = w.img; else viaServer();
  return img;
}

let WISHES = [], OPTS = null, FILTER = 'all';
const match = (w, k) => k === 'all' || (k === 'none' ? !OPTS.prioritas.includes(w.prioritas) : w.prioritas === k);

let toastT;
function toast(t) {
  const e = $('toast'); e.textContent = t; e.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 3500);
}
const fmtNum = n => n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
const btn = (text, cls, fn) => Object.assign(document.createElement('button'), { type: 'button', className: cls, textContent: text, onclick: fn });

// Isi detail yang muncul saat barang diketuk
function detailsOf(w) {
  const box = document.createElement('div');
  box.className = 'det';
  const add = (label, val, isLink) => {
    if (!val) return;
    const p = document.createElement('div'); p.className = 'kv';
    const k = document.createElement('span'); k.textContent = label;
    const v = document.createElement(isLink ? 'a' : 'div');
    v.textContent = val;
    if (isLink && /^https?:\/\//i.test(val)) { v.href = val; v.target = '_blank'; v.rel = 'noopener noreferrer'; }
    p.append(k, v); box.append(p);
  };
  add('Spesifikasi', w.spek);
  add('Keterangan', w.ket);
  add('Link', w.link, true);
  if (!box.children.length) { const m = document.createElement('div'); m.className = 'kv muted'; m.textContent = 'Belum ada detail.'; box.append(m); }

  const acts = document.createElement('div'); acts.className = 'acts';
  const del = btn('Hapus', 'ghost sm danger', () => removeWish(w, del));
  acts.append(btn('Ubah', 'ghost sm', () => openEdit(w, box)), del);
  box.append(acts);
  return box;
}

// Form ubah prioritas, status, dan harga
function openEdit(w, box) {
  box.innerHTML = '';
  const f = document.createElement('div'); f.className = 'edit';
  const group = (title, name, items, cur) => {
    const t = document.createElement('div'); t.className = 'lbl'; t.textContent = title;
    const seg = document.createElement('div'); seg.className = 'seg';
    items.forEach((it, i) => {
      const id = 'e' + w.row + name + i;
      seg.append(
        Object.assign(document.createElement('input'), { type: 'radio', name: name + w.row, id: id, value: it, checked: it === cur }),
        Object.assign(document.createElement('label'), { htmlFor: id, textContent: it }));
    });
    f.append(t, seg);
  };
  group('Prioritas', 'p', OPTS.prioritas, w.prioritas);
  group('Status', 's', OPTS.status, w.status);
  const hl = Object.assign(document.createElement('label'), { htmlFor: 'eh' + w.row, textContent: 'Estimasi harga' });
  const hi = Object.assign(document.createElement('input'), { type: 'text', id: 'eh' + w.row, inputMode: 'numeric', value: fmtNum(w.harga), oninput: rupiahInput });
  f.append(hl, hi);

  const pick = n => { const c = f.querySelector('input[name=' + n + w.row + ']:checked'); return c ? c.value : ''; };
  const save = btn('Simpan perubahan', 'save', () => {
    save.disabled = true; save.textContent = 'Menyimpan...';
    google.script.run
      .withSuccessHandler(r => { render(r.wishes); toast('Perubahan tersimpan.'); })
      .withFailureHandler(err => { save.disabled = false; save.textContent = 'Simpan perubahan'; toast('Gagal: ' + err.message); })
      .updateWish(w.row, w.barang, { prioritas: pick('p'), status: pick('s'), harga: hi.value.replace(/\D/g, '') });
  });
  f.append(save, btn('Batal', 'ghost sm', () => render()));
  box.append(f);
}

// Hapus: ketuk dua kali (kedua kalinya sebagai konfirmasi)
function removeWish(w, b) {
  if (!b.dataset.sure) {
    b.dataset.sure = '1'; b.textContent = 'Yakin hapus?';
    setTimeout(() => { if (b.isConnected && !b.disabled) { delete b.dataset.sure; b.textContent = 'Hapus'; } }, 4000);
    return;
  }
  b.disabled = true; b.textContent = 'Menghapus...';
  google.script.run
    .withSuccessHandler(r => { Object.keys(IMGS).forEach(k => delete IMGS[k]); render(r.wishes); toast('Barang dihapus.'); })
    .withFailureHandler(err => { b.disabled = false; delete b.dataset.sure; b.textContent = 'Hapus'; toast('Gagal: ' + err.message); })
    .deleteWish(w.row, w.barang);
}

function render(wishes) {
  if (wishes) WISHES = wishes;
  if (!OPTS) return;
  $('total').textContent = rupiah(WISHES.reduce((s, w) => s + w.harga, 0));
  $('count').textContent = WISHES.length + ' barang';

  // Ringkasan per prioritas (bisa diklik untuk menyaring daftar)
  const chips = [['all', 'Semua']].concat(OPTS.prioritas.map(p => [p, p]));
  if (WISHES.some(w => match(w, 'none'))) chips.push(['none', 'Tanpa prioritas']);
  $('stats').innerHTML = '';
  chips.forEach(([k, label]) => {
    const bt = document.createElement('button'); bt.type = 'button';
    bt.setAttribute('aria-pressed', String(FILTER === k));
    const n = document.createElement('b'); n.textContent = WISHES.filter(w => match(w, k)).length;
    bt.append(n, label);
    bt.onclick = () => { FILTER = k; render(); };
    $('stats').append(bt);
  });

  // Daftar lengkap
  const shown = WISHES.filter(w => match(w, FILTER));
  $('sub').textContent = shown.length + ' barang \u00B7 ' + rupiah(shown.reduce((s, w) => s + w.harga, 0));
  const box = $('list');
  box.innerHTML = '';
  if (!shown.length) { box.innerHTML = '<p class="empty">Belum ada barang di sini.</p>'; return; }
  shown.forEach(w => {
    const d = document.createElement('div'); d.className = 'item';
    if (/sudah/i.test(w.status)) d.classList.add('done');
    if (/batal/i.test(w.status)) d.classList.add('done', 'batal');
    const ph = () => Object.assign(document.createElement('div'), { className: 'ph' });
    const pic = (w.img || w.hasImg) ? makeThumb(w) : ph();
    const t = document.createElement('div');
    const b = document.createElement('b'); b.textContent = w.barang;
    const s = document.createElement('small'); s.textContent = [w.kategori, rupiah(w.harga), w.prioritas, w.status].filter(Boolean).join(' \u00B7 ');
    t.append(b, s);
    const head = document.createElement('button');
    head.type = 'button'; head.className = 'row'; head.setAttribute('aria-expanded', 'false');
    const chev = document.createElement('span'); chev.className = 'chev';
    head.append(pic, t, chev);
    const det = detailsOf(w); det.hidden = true;
    head.onclick = () => { det.hidden = !det.hidden; head.setAttribute('aria-expanded', String(!det.hidden)); };
    d.append(head, det); box.append(d);
  });
}

// Kecilkan foto dulu (maks 640px) supaya cepat terkirim
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('Foto tidak bisa dibaca.'));
    img.src = url;
  });
}

function setThumb(src) {
  $('thumb').style.backgroundImage = src ? 'url("' + src + '")' : '';
  $('thumb').textContent = src ? '' : 'Belum ada';
  $('thumb').classList.toggle('has', !!src);
}

$('pick').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { imageBase64 = await shrink(f); setThumb(imageBase64); $('imageUrl').value = ''; }
  catch (err) { say(err.message, 'err'); }
};
$('imageUrl').oninput = () => {
  const v = $('imageUrl').value.trim();
  if (v.indexOf('data:image') === 0) {
    // "Salin alamat gambar" dari Google sering berupa data:image... -> simpan sebagai foto
    imageBase64 = v; $('file').value = ''; $('imageUrl').value = ''; setThumb(v);
    say('Gambar dari Google terdeteksi, akan disimpan sebagai foto.', 'ok');
  } else if (v) { imageBase64 = ''; $('file').value = ''; setThumb(v); }
  else setThumb('');
};

$('f').onsubmit = e => {
  e.preventDefault();
  const val = n => document.querySelector('input[name=' + n + ']:checked').value;
  const data = {
    barang: $('barang').value.toUpperCase(), kategori: $('kategori').value, harga: $('harga').value.replace(/\D/g, ''),
    prioritas: val('prioritas'), status: val('status'),
    spesifikasi: $('spesifikasi').value.toUpperCase(), keterangan: $('keterangan').value.toUpperCase(),
    link: $('link').value, imageUrl: $('imageUrl').value, imageBase64: imageBase64
  };
  $('save').disabled = true; say('Menyimpan\u2026');
  google.script.run
    .withSuccessHandler(r => {
      $('save').disabled = false;
      say(r.gambar ? 'Tersimpan di baris ' + r.row + '.' : 'Tersimpan di baris ' + r.row + ', tapi gambar tidak ditemukan. Coba upload foto atau tempel link gambar.', r.gambar ? 'ok' : 'err');
      $('f').reset(); imageBase64 = ''; setThumb('');
      FILTER = 'all'; render(r.wishes);
      const first = $('list').querySelector('.item'); if (first) first.classList.add('new');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    })
    .withFailureHandler(err => { $('save').disabled = false; say('Gagal menyimpan: ' + err.message, 'err'); })
    .addWish(data);
};

google.script.run
  .withSuccessHandler(d => {
    $('kategori').innerHTML = d.options.kategori.map(k => '<option>' + k.replace(/&/g, '&amp;') + '</option>').join('');
    radios('prioritas', d.options.prioritas, 1);
    radios('status', d.options.status, 1);
    OPTS = d.options; boot(''); render(d.wishes);
  })
  .withFailureHandler(err => boot('Gagal memuat data: ' + err.message, true))
  .getInitData();
</script>
</body>
</html>
